# Render Blueprint. Deploys Claude Lazy Starter as an always on Docker web
# service with a persistent disk so your captured session and history survive
# restarts. A paid plan is required: free services spin down and would not be
# awake to open your window overnight.
services:
  - type: web
    name: claude-lazy-starter
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/scheduler
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LAZY_DRIVER
        value: playwright
      - key: LAZY_HEADLESS
        value: "true"
      - key: LAZY_DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      # A random admin token is generated on first deploy. Read it from the
      # Render dashboard and use it with npm run upload-session.
      - key: ADMIN_TOKEN
        generateValue: true
      # Set this to your Render URL for correct metadata and sitemap.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
